<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schapwijzer</title>
    <style>
        :root {
            --yellow: #FFCC00;
            --red: #E2001A;
            --white: #FFFFFF;
            --black: #1A1A1A;
            --gray: #666666;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: var(--yellow);
            color: var(--black);
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .wrap {
            width: 100%;
            max-width: 420px;
            padding: 24px 18px 50px;
        }

        .header {
            background: var(--red);
            color: var(--white);
            padding: 16px 18px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 22px;
        }

        .header p {
            margin: 4px 0 0;
            font-size: 13px;
            opacity: .9;
        }

        .card {
            background: var(--white);
            border-radius: 10px;
            padding: 18px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        label {
            font-size: 13px;
            font-weight: bold;
            display: block;
            margin-bottom: 6px;
        }

        .row {
            display: flex;
            gap: 8px;
        }

        input#code {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border: 2px solid var(--black);
            border-radius: 6px;
            color: var(--black);
        }

        input#code:focus {
            outline: none;
            border-color: var(--red);
        }

        button {
            background: var(--red);
            color: var(--white);
            border: none;
            padding: 0 18px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }

        button:active {
            opacity: .85;
        }

        .error {
            margin-top: 12px;
            color: var(--red);
            font-size: 13px;
            font-weight: bold;
            display: none;
        }

        .result {
            margin-top: 18px;
            display: none;
        }

        .result .line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            border-bottom: 1px solid #eee;
            font-size: 15px;
        }

        .result .line:last-child {
            border-bottom: none;
        }

        .result .label {
            color: var(--gray);
            font-size: 13px;
        }

        .result .value {
            font-weight: bold;
            font-size: 18px;
            color: var(--black);
        }

        .hint {
            margin-top: 14px;
            font-size: 12px;
            color: var(--gray);
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .tab {
            flex: 1;
            text-align: center;
            font-weight: bold;
            font-size: 13px;
            padding: 10px 8px;
            border-radius: 6px;
            border: 2px solid var(--black);
            background: var(--white);
            cursor: pointer;
        }

        .tab.active {
            background: var(--red);
            color: var(--white);
            border-color: var(--red);
        }

        #reader {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
            margin-bottom: 10px;
        }

        #scanBtn,
        #stopBtn {
            width: 100%;
            padding: 12px;
            font-size: 17px;
        }

        #scanBtn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
    </style>
</head>

<body>
    <div class="wrap">

        <div class="header">
            <h1>Schapwijzer</h1>
            <p>Vul de kaartjescode in om de locatie te vinden</p>
        </div>

        <div class="card">

            <div id="scanPane">
                <div id="reader"></div>
                <button id="scanBtn" type="button">
                    Scan met camera
                    <svg width="35" height="35" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"
                        style="margin-left: 6px;">
                        <path
                            d="M4 8C4 6.89543 4.89543 6 6 6H8.17157C8.70201 6 9.21071 5.78929 9.58579 5.41421L10.5858 4.41421C10.9609 4.03914 11.4696 3.82843 12 3.82843C12.5304 3.82843 13.0391 4.03914 13.4142 4.41421L14.4142 5.41421C14.7893 5.78929 15.298 6 15.8284 6H18C19.1046 6 20 6.89543 20 8V17C20 18.1046 19.1046 19 18 19H6C4.89543 19 4 18.1046 4 17V8Z"
                            stroke="white" stroke-width="2" stroke-linejoin="round" />
                        <circle cx="12" cy="12.5" r="3.5" stroke="white" stroke-width="1.8" />
                    </svg>
                </button>
                <button id="stopBtn" type="button" style="display:none;">Stop camera</button>
            </div>

            <p style="text-align: center; margin: 16px 0; font-weight: bold;">of</p>


            <div id="manualPane">
                <label for="code">Vul in handmatig</label>
                <div class="row">
                    <input id="code" inputmode="numeric" placeholder="1111.02.3.004.01" maxlength="17">
                    <button id="searchBtn" type="button">Zoek</button>
                </div>
            </div>

            <div class="error" id="error"></div>

            <div class="result" id="result">
                <div class="line"><span class="label">Meter</span><span class="value" id="outMeter">–</span></div>
                <div class="line"><span class="label">Plank</span><span class="value" id="outPlank">–</span></div>
                <div class="line"><span class="label">Positie</span><span class="value" id="outPositie">–</span></div>
                <div class="line"><span class="label">Naast elkaar</span><span class="value" id="outBreedte">–</span>
                </div>
            </div>

            <p class="hint">Voorbeeld: 1111.02.3.004.01 → meter 2, plank 3, positie 4, breedte 1</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="config.js"></script>
    <script>
        document.getElementById('searchBtn').onclick = search;
        document.getElementById('code').addEventListener('input', formatCode);
        document.getElementById('code').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') search();
        });

        function formatCode(e) {
            const input = e.target;
            let digits = input.value.replace(/\D/g, '').slice(0, 12);

            const groups = [4, 2, 1, 3, 2];
            let formatted = '';
            let pos = 0;

            for (let i = 0; i < groups.length; i++) {
                const len = groups[i];
                if (digits.length <= pos) break;

                const chunk = digits.slice(pos, pos + len);
                formatted += chunk;
                pos += len;

                // zet meteen een punt neer zodra dit segment vol is, ongeacht of er al meer getypt is
                if (chunk.length === len && i < groups.length - 1) {
                    formatted += '.';
                }
            }

            input.value = formatted;
        }

        async function processCode(code) {
            const errorEl = document.getElementById('error');
            const resultEl = document.getElementById('result');
            errorEl.style.display = 'none';
            resultEl.style.display = 'none';

            if (!code) {
                errorEl.textContent = 'Voer een code in.';
                errorEl.style.display = 'block';
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/calculate/${encodeURIComponent(code)}`);
                if (!res.ok) throw new Error('format');
                const data = await res.json();
                showResult(data);
            } catch (err) {
                errorEl.textContent = 'Formaat klopt niet. Verwacht bv: 1111.02.3.004.01';
                errorEl.style.display = 'block';
            }
        }

        function search() {
            const code = document.getElementById('code').value.trim();
            processCode(code);
        }

        function showResult(data) {
            document.getElementById('outMeter').textContent = data.meter;
            document.getElementById('outPlank').textContent = data.plank;
            document.getElementById('outPositie').textContent = data.positie;
            document.getElementById('outBreedte').textContent = data.breedte;

            document.getElementById('result').style.display = 'block';
        }

        let html5QrCode = null;
        let scanning = false;

        document.getElementById('tabScan').onclick = () => switchTab('scan');
        document.getElementById('tabManual').onclick = () => switchTab('manual');

        function switchTab(which) {
            const isScan = which === 'scan';
            document.getElementById('tabScan').classList.toggle('active', isScan);
            document.getElementById('tabManual').classList.toggle('active', !isScan);
            document.getElementById('scanPane').style.display = isScan ? '' : 'none';
            document.getElementById('manualPane').style.display = isScan ? 'none' : '';
            if (!isScan) stopScanning();
        }

        document.getElementById('scanBtn').onclick = startScanning;
        document.getElementById('stopBtn').onclick = stopScanning;

        function startScanning() {
            if (scanning) return;
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 120 } },
                (decodedText) => {
                    processCode(decodedText);
                    stopScanning();
                },
                () => { } // scan-fouten per frame negeren
            ).then(() => {
                scanning = true;
                document.getElementById('scanBtn').style.display = 'none';
                document.getElementById('stopBtn').style.display = '';
            }).catch(err => {
                alert('Camera kon niet starten: ' + err);
            });
        }

        function stopScanning() {
            if (html5QrCode && scanning) {
                html5QrCode.stop().then(() => {
                    html5QrCode.clear();
                    scanning = false;
                    document.getElementById('scanBtn').style.display = '';
                    document.getElementById('stopBtn').style.display = 'none';
                }).catch(() => { });
            }
        }
    </script>
</body>

</html>
